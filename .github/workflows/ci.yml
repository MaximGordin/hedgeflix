name: Main check
on: [pull_request]
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install
      - run: cd backend
      - run: pnpm lint
      - run: pnpm jest